<div class="plugins-tab">
    <div class="setting-group plugins-intro">
        <p class="setting-desc">
            插件商城提供可选的功能模块。点击卡片右侧开关即可启用或禁用，展开配置按钮可调整插件行为。
            核心模块（搜索、主题按钮、品牌）不在此处，它们始终存在，可在<strong>布局 DIY</strong>中调整位置。
        </p>
    </div>

    <section class="plugin-section" data-section="installed">
        <h4 class="plugin-section-title">已安装</h4>
        <div class="plugin-list" data-list="installed"></div>
    </section>

    <section class="plugin-section" data-section="available">
        <h4 class="plugin-section-title">可安装</h4>
        <div class="plugin-list" data-list="available"></div>
        <p class="plugin-empty-hint" data-role="empty-available">所有内置插件均已安装</p>
    </section>
</div>
