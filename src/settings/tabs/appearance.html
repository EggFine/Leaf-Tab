<div class="setting-group">
    <div class="setting-item">
        <label data-i18n="settings.appearance.theme.label">主题外观</label>
        <div class="custom-select-wrapper" id="themeSelect">
            <div class="custom-select" tabindex="0">
                <span class="selected-value" data-i18n="settings.appearance.theme.system">跟随系统</span>
                <svg class="chevron" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
            </div>
            <div class="custom-options">
                <div class="custom-option" data-value="system" data-i18n="settings.appearance.theme.system">跟随系统</div>
                <div class="custom-option" data-value="light" data-i18n="settings.appearance.theme.light">浅色模式</div>
                <div class="custom-option" data-value="dark" data-i18n="settings.appearance.theme.dark">深色模式</div>
            </div>
        </div>
    </div>
</div>
